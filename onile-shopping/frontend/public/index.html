<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK Myanmar Food</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+Myanmar:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <!-- ヘッダー -->
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/icon/logo.jpg" alt="AK Myanmar Food Logo" class="brand-logo" />
      <span data-i18n="brand">AK Myanmar Food</span>
    </a>

    <nav id="authNav" class="header-actions">
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="my">မြန်မာဘာသာ</option>
      </select>

      <a href="/login.html" class="nav-link" data-i18n="login">ログイン</a>
      <a href="/register.html" class="nav-link" data-i18n="register">新規登録</a>
      <a href="/admin-login.html" class="nav-link nav-link--gold" data-i18n="adminLogin">管理者ログイン</a>

      <button id="logoutBtn" class="nav-link nav-button" type="button" data-i18n="logout" hidden>
        ログアウト
      </button>
    </nav>
  </header>

  <!-- メインビジュアル -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__text">
        <p class="badge">AK MYANMAR FOOD</p>
        <h1 data-i18n="heroTitle">AK Myanmar Food</h1>
        <p data-i18n="heroText">
          本格ミャンマー料理を、見やすいカード一覧でゆっくり選べる料理メニューです。
        </p>
      </div>

      <div class="hero__logo-card">
        <img src="/icon/logo1.jpg" alt="AK Myanmar Food" />
      </div>
    </div>
  </section>

  <!-- 料理メニュー -->
  <main class="container">
    <section class="menu-panel">
      <div class="section-head">
        <div>
          <h2 data-i18n="foodMenu">料理メニュー</h2>
          <p data-i18n="foodMenuText">登録された料理を写真付きで表示しています。</p>
        </div>

        <p id="userStatus" class="user-status"></p>
      </div>

      <div id="foodGrid" class="food-grid"></div>

      <p id="emptyMessage" class="empty-message" data-i18n="emptyFood">
        まだ料理が登録されていません。
      </p>
    </section>
  </main>

  <!-- 多言語切り替え -->
  <script src="/i18n.js"></script>

  <!-- 一般ユーザー画面の処理 -->
  <script src="/frontend.js"></script>
</body>
</html>
