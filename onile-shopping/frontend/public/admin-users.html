<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-page-title="adminUsers">管理者管理 | AK Myanmar Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+Myanmar:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <div class="topbar">
        <div class="brand-wrap">
          <img src="/icon/logo1.jpg" alt="AK Myanmar Food logo" class="brand-logo" />
          <p class="badge" data-i18n="admin.badgeUsers">ADMIN USERS</p>
        </div>
        <div class="topbar__actions">
          <div class="lang-switch" aria-label="language switcher">
            <button type="button" class="lang-switch__btn" data-lang="ja">JP</button>
            <button type="button" class="lang-switch__btn" data-lang="my">MY</button>
            <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
          </div>
          <nav class="nav-links">
            <a href="/admin.html" class="nav-pill" data-i18n="admin.navFood">料理管理</a>
            <a href="/admin-users.html" class="nav-pill nav-pill--active" data-i18n="admin.navUsers">管理者管理</a>
            <button id="adminLogoutBtn" class="nav-button nav-button--light" data-i18n="admin.navLogout">ログアウト</button>
          </nav>
        </div>
      </div>
      <h1 data-i18n="admin.usersTitle">管理者管理</h1>
      <p data-i18n="admin.usersLead">管理者アカウントの追加、一覧表示、削除を行えます。自分自身は削除できません。</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2 data-i18n="admin.addAdminTitle">管理者を追加</h2>
      <p class="hint" data-i18n="admin.addAdminHint">新しい管理者IDとパスワードを登録します。</p>
      <form id="adminCreateForm" class="stack-form">
        <div class="form-grid">
          <label>
            <span data-i18n="admin.usernameLabel">管理者ID</span>
            <input name="username" type="text" required data-i18n-placeholder="admin.usernamePlaceholder" placeholder="管理者IDを入力" />
          </label>
          <label>
            <span data-i18n="admin.passwordLabel">パスワード</span>
            <input name="password" type="password" required data-i18n-placeholder="admin.passwordPlaceholder" placeholder="パスワードを入力" />
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn--primary" data-i18n="admin.createAdminButton">管理者を追加</button>
        </div>
      </form>
      <p id="adminUserMessage" class="status"></p>
    </section>

    <section class="panel catalog-section">
      <h2 data-i18n="admin.adminListTitle">管理者一覧</h2>
      <p class="hint" data-i18n="admin.adminListHint">自分以外の管理者は削除できます。</p>
      <div id="adminList" class="admin-list"></div>
      <p id="adminListEmpty" class="empty" data-i18n="admin.noAdmins">管理者が見つかりません。</p>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
