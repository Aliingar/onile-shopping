<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-page-title="adminLogin">管理者ログイン | AK Myanmar Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+Myanmar:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero hero--compact">
    <div class="hero__inner">
      <div class="topbar">
        <div class="brand-wrap">
          <img src="/icon/logo1.jpg" alt="AK Myanmar Food logo" class="brand-logo" />
          <p class="badge" data-i18n="admin.badgeLogin">ADMIN LOGIN</p>
        </div>
        <div class="lang-switch" aria-label="language switcher">
          <button type="button" class="lang-switch__btn" data-lang="ja">JP</button>
          <button type="button" class="lang-switch__btn" data-lang="my">MY</button>
          <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
        </div>
      </div>
      <h1 data-i18n="admin.loginTitle">管理者ログイン</h1>
      <p data-i18n="admin.loginLead">管理者アカウントでログインして、料理や管理者を管理できます。</p>
    </div>
  </header>

  <main class="container container--narrow">
    <section class="panel auth-panel">
      <h2 data-i18n="admin.loginFormTitle">管理者ログイン</h2>
      <form id="adminLoginForm" class="stack-form">
        <label>
          <span data-i18n="admin.usernameLabel">管理者ID</span>
          <input id="usernameInput" name="username" type="text" value="admin" required data-i18n-placeholder="admin.usernamePlaceholder" placeholder="管理者IDを入力" />
        </label>
        <label>
          <span data-i18n="admin.passwordLabel">パスワード</span>
          <input id="passwordInput" name="password" type="password" value="admin123" required data-i18n-placeholder="admin.passwordPlaceholder" placeholder="パスワードを入力" />
        </label>
        <button type="submit" class="btn btn--primary" data-i18n="admin.loginButton">管理者としてログイン</button>
      </form>
      <p id="messageBox" class="status"></p>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
