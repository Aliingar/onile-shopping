<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AK Myanmar Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+Myanmar:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/icon/logo.jpg" alt="AK Myanmar Food Logo" class="brand-logo" />
      <span data-i18n="brand">AK Myanmar Food</span>
    </a>

    <nav class="header-actions">
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="my">မြန်မာဘာသာ</option>
      </select>
    </nav>
  </header>

  <main class="container container--narrow">
    <section class="panel auth-panel">
      <h2 data-i18n="login">ログイン</h2>
      <form id="loginForm" class="stack-form">
        <label>
          <span>Username</span>
          <input name="username" type="text" required />
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" required />
        </label>
        <button type="submit" class="btn btn--primary" data-i18n="login">ログイン</button>
      </form>
      <p id="messageBox" class="status"></p>
      <p class="auth-links"><a href="/register.html" data-i18n="register">新規登録</a></p>
    </section>
  </main>

  <script src="/i18n.js"></script>
  <script src="/frontend.js"></script>
</body>
</html>
