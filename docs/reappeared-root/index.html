<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Shopping Food Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="badge">FOOD CATALOG</p>
      <h1>料理写真をアップロードして、<br />商品カードを作成</h1>
      <p>商品名・値段・料理写真を登録すると、下に商品一覧として表示されます。</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>商品を追加</h2>
      <p class="hint">写真はパソコンから選択できます。画像URLや images/mohinga.jpg のようなパスも使えます。</p>

      <form id="productForm" class="product-form">
        <div class="form-grid">
          <label>
            商品名
            <input id="nameInput" type="text" placeholder="例: Mohinga" required />
          </label>

          <label>
            値段
            <input id="priceInput" type="text" placeholder="例: 800円" required />
          </label>
        </div>

        <label>
          写真をアップロード
          <input id="fileInput" type="file" accept="image/*" />
        </label>

        <div class="or-divider">または</div>

        <label>
          写真パス または 画像URL
          <input id="imageUrlInput" type="text" placeholder="例: images/mohinga.jpg" />
        </label>

        <div id="previewBox" class="preview-box" hidden>
          <p>プレビュー</p>
          <img id="previewImage" alt="選択した写真のプレビュー" />
        </div>

        <div class="actions">
          <button type="submit" class="btn btn--primary">商品を追加</button>
          <button id="clearAllBtn" type="button" class="btn btn--ghost">すべて削除</button>
        </div>
      </form>

      <p id="statusText" class="status">保存済み商品: 0件</p>
    </section>

    <section class="catalog-section">
      <h2>商品一覧</h2>
      <div id="catalog" class="catalog"></div>
      <p id="emptyMessage" class="empty">まだ商品がありません。上のフォームから追加してください。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
